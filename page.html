<!doctype html><html lang="zh"><meta charset="utf-8"><title>半导体财报问答</title><style>body{font:16px system-ui;max-width:1050px;margin:40px auto;background:#f4f7fb;color:#182b46;padding:20px}section{background:white;padding:24px;border-radius:14px;margin:18px 0}textarea{width:95%;font:inherit;padding:12px}button{background:#2359ac;color:white;border:0;border-radius:6px;padding:12px 25px;cursor:pointer}label{display:inline-block;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 system-ui}small{color:#53667f}summary{cursor:pointer;padding:10px}#answer{white-space:pre-wrap;line-height:1.8}</style><h1>半导体上市公司财报问答</h1><p>2025 年报 · 向量检索 + BM25 · 答案可追溯</p><section><h3>选择公司</h3><div id="companies"></div><small>单公司题勾选对应公司；全景题勾选全部公司。未选择时按全部公司检索。</small><h3>输入问题</h3><textarea id="q" rows="3" placeholder="例如：兆易创新2025年的营业收入是多少？同比增长多少？"></textarea><p><button id="ask">查询</button> <button id="download">下载本次记录</button></p><div id="status"></div></section><section><h3>回答</h3><div id="answer">等待提问</div></section><section><h3>召回依据与出处</h3><div id="sources"></div></section><script>
let current=null;fetch('/inventory').then(r=>r.json()).then(a=>{for(const x of a){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=x.company;l.append(c,document.createTextNode(x.company));document.querySelector('#companies').append(l)}});
document.querySelector('#ask').onclick=async()=>{let b=document.querySelector('#ask');b.disabled=true;document.querySelector('#status').textContent='检索中…';try{let r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#q').value,companies:[...document.querySelectorAll('input:checked')].map(x=>x.value)})});let d=await r.json();if(d.error)throw Error(d.error);current=d;document.querySelector('#answer').textContent=d.answer;document.querySelector('#status').textContent=(d.generated?'生成式问答':'原文检索模式')+'；向量类型：'+(d.index_mode==='lsa'?'LSA 基线':'神经嵌入');let s=document.querySelector('#sources');s.replaceChildren();for(let h of d.hits){let e=document.createElement('details'),t=document.createElement('summary'),p=document.createElement('pre');t.textContent=`[${h.source}] ${h.company} · ${h.year}年报 · PDF第${h.page}页 · ${h.section}`;p.textContent=h.text+`\n\nBM25: ${h.bm25.toFixed(3)} / 向量相似度: ${h.vector.toFixed(3)}`;e.append(t,p);s.append(e)}}catch(e){document.querySelector('#status').textContent='失败：'+e.message}finally{b.disabled=false}};
document.querySelector('#download').onclick=()=>{if(!current)return alert('先运行一次查询');let u=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='问答记录.json';a.click();URL.revokeObjectURL(u)};
</script></html>
